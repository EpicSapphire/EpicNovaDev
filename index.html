<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Epic Nova</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <header class="hero">
    <img 
      src="images/New_Epic_Nova_Logo.png" 
      alt="Epic Nova Logo" 
      class="logo" 
    />

    <p class="eyebrow">Player Access Portal</p>
    <h1>Epic Nova</h1>
    <p class="tagline">Override Reality.</p>

    <section class="hud-card" id="nova-core">
      <div class="hud-top">
        <div>
          <h2>Nova Core Stash</h2>
          <p>Player profile online</p>
        </div>

        <span class="status">ONLINE</span>
      </div>

      <div class="player-card">
        <div class="avatar-ring">NR</div>

        <div class="player-info">
          <p class="player-label">Gamer Profile</p>
          <h3>NovaRift_87</h3>
          <p>Level 12
