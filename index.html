<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Epic Nova</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- HERO -->
  <header class="hero">
    <img 
      src="images/New_Epic_Nova_Logo.png" 
      alt="Epic Nova Logo" 
      class="logo"
    />

    <h1>Epic Nova</h1>
    <p>Override Reality.</p>

    <!-- NOVA CORE HUD -->
    <section class="nova-login-screen" id="nova-core">
      <div class="hud-card">

        <div class="hud-header">
          <h2>Nova Core Access</h2>
          <p>Player Stash Online</p>
        </div>

        <div class="player-panel">
          <div class="avatar-ring">
            <span>NB</span>
          </div>

          <div>
            <h2>Welcome, Player</h2>
            <p class="rank">Nova Core Member</p>
          </div>
        </div>

        <div class="stash-grid">
          <div class="stash-box">
            <span class="label">Nova Bits</span>
            <strong id="nova-bit-count">Loading...</strong>
          </div>

          <div class="stash-box">
            <span class="label">Nova Shards</span>
            <strong id="nova-shard-count">Loading...</strong>
          </div>

          <div class="stash-box premium">
            <span class="label">Nova Cores</span>
            <strong id="nova-core-count">Loading...</strong>
          </div>
        </div>

        <div class="energy-bar">
          <span>Core Energy</span>
          <div class="bar">
            <div class="fill"></div>
          </div>
        </div>

        <div class="hud-buttons">
          <a href="#email" class="hud-btn">Enter
